services:

  nexusflow:
    build:
      context: ..
      dockerfile: docker/nexusflow/Dockerfile.linux
    container_name: nexusflow
    restart: unless-stopped
    env_file:
      - ./config/.env.production
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "9100:9100"
    networks:
      - nexusflow

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.1
    container_name: nexusflow-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexusflow

  redis:
    image: redis:8
    container_name: nexusflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexusflow

  postgres:
    image: postgres:16
    container_name: nexusflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: frip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frip"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexusflow

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: nexusflow-prometheus
    restart: unless-stopped
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nexusflow

  grafana:
    image: grafana/grafana:12.1.1
    container_name: nexusflow-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - nexusflow

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: nexusflow-otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ../config/otel/collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - nexusflow

  tempo:
    image: grafana/tempo:2.8.2
    container_name: nexusflow-tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ../config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - ../data/tempo:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - nexusflow

networks:
  nexusflow:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

apiVersion: batch/v1
kind: Job
metadata:
  name: nexusflow-smoke-test
  namespace: nexusflow
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: nexusflow
        component: smoke-test
    spec:
      restartPolicy: Never
      containers:
        - name: nexusflow
          image: nexusflow:linux
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

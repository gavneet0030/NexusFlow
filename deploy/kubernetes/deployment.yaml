apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusflow
  namespace: nexusflow
  labels:
    app.kubernetes.io/name: nexusflow
    app.kubernetes.io/component: processing-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexusflow
        app.kubernetes.io/component: processing-engine
    spec:
      serviceAccountName: nexusflow
      containers:
        - name: nexusflow
          image: nexusflow:linux-service
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: nexusflow-config
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30


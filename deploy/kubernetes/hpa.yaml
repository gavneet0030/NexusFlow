apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexusflow
  namespace: nexusflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexusflow

  minReplicas: 2
  maxReplicas: 8

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
